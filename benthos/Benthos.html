<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benthos: The Silent Pressure</title>
<style>
  /* One deliberate look: a black CRT in a dark room. */
  :root { color-scheme: dark; --bg: #000000; --amber: #d98e1c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--amber); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; image-rendering: pixelated; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  noscript { color: var(--amber); font: 14px monospace; position: fixed; inset: 40% 0 auto; text-align: center; }
</style>
</head>
<body>
<canvas id="game" aria-label="Benthos: The Silent Pressure, a survival-horror descent"></canvas>
<noscript>Benthos needs JavaScript.</noscript>
<script>/* src/core.js */
/* BENTHOS: THE SILENT PRESSURE
 * core.js — namespace, constants, math, noise, input and persistence.
 * Every file is a classic script that adds to window.B, so the game runs from file:// with no build step. */
'use strict';
window.B = window.B || {};
(function (B) {
  B.VERSION = '0.1.0';

  // Internal resolution (New Game+ drops to 320x180, see B.setRes).
  B.W = 480; B.H = 270;
  // Compressed world projection: 12 px per metre east-west, 8 px per metre north-south, 2.5 px per metre of depth.
  // The trench is far too deep to draw at scale, so depth is squashed. Models (suits, creatures) use the
  // natural camera below so they are not squashed with it.
  B.PX = 12; B.PY = 8; B.PZ = 2.5; B.SC = 1; // SC doubles everything for the Machine's Eye (finer, not wider)
  B.SN = 0.6667; B.CS = 0.7454; // natural camera elevation (sin, cos), about 42 degrees
  B.OFF = -30;                   // the diver sits a little above the centre so more of "below" is visible

  // ---------------------------------------------------------------- math
  const M = B.M = {
    clamp: (v, a, b) => v < a ? a : v > b ? b : v,
    lerp: (a, b, t) => a + (b - a) * t,
    smooth(a, b, v) { const t = M.clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); },
    len2: (x, y) => Math.sqrt(x * x + y * y),
    len3: (x, y, z) => Math.sqrt(x * x + y * y + z * z),
    d3: (a, b) => Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2),
    d2: (a, b) => Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2),
    wrap(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; },
    approach(v, target, step) { return v < target ? Math.min(target, v + step) : Math.max(target, v - step); },
    rnd: (a, b) => a + Math.random() * (b - a),
    pick: arr => arr[(Math.random() * arr.length) | 0],
    chance: p => Math.random() < p,
  };

  // Seeded RNG (mulberry32).
  B.rng = function (seed) {
    let s = seed >>> 0;
    const f = function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.range = (a, b) => a + f() * (b - a);
    f.int = (a, b) => (a + f() * (b - a + 1)) | 0;
    return f;
  };

  // ---------------------------------------------------------------- noise
  function hash2(ix, iy, seed) {
    let h = (ix * 374761393 + iy * 668265263 + seed * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  B.hash2 = hash2;
  B.noise2 = function (x, y, seed) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const s = seed | 0;
    const a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s), c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  };
  B.fbm2 = function (x, y, oct, seed) {
    let v = 0, amp = 0.5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { v += amp * B.noise2(x * f, y * f, seed + i * 17); norm += amp; amp *= 0.5; f *= 2.03; }
    return v / norm;
  };
  B.noise1 = (x, seed) => B.noise2(x, 0.5, seed);

  // ---------------------------------------------------------------- input
  const KEYMAP = {
    up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
    boost: ['ShiftLeft', 'ShiftRight'], rise: ['Space'], sink: ['KeyC'], ping: ['KeyR'], lamp: ['KeyF'],
    interact: ['KeyE'], clamp: ['KeyQ'], powerhead: ['KeyX'], graft: ['KeyG'], breath: ['KeyV'], gauge: ['KeyH'],
    craft: ['Tab'], map: ['KeyM'], pause: ['Escape', 'KeyP'], wipe: ['KeyZ'], swap: ['KeyT'], listen: [], lens: ['KeyB'],
    c1: ['Digit1'], c2: ['Digit2'], c3: ['Digit3'], c4: ['Digit4'], c5: ['Digit5'],
    confirm: ['Enter', 'Space', 'KeyE'], back: ['Escape', 'Backspace'],
    mUp: ['ArrowUp', 'KeyW'], mDown: ['ArrowDown', 'KeyS'], mLeft: ['ArrowLeft', 'KeyA'], mRight: ['ArrowRight', 'KeyD'],
  };
  // Gamepad (standard mapping) button -> actions.
  const PADMAP = {
    0: ['interact', 'confirm'], 1: ['clamp', 'back'], 2: ['ping'], 3: ['lamp'], 4: ['rise'], 5: ['sink'],
    6: ['listen'], 7: ['boost'], 8: ['craft'], 9: ['pause'], 10: ['breath'], 11: ['pick'],
    12: ['mUp', 'useCell'], 13: ['mDown', 'gauge'], 14: ['mLeft', 'cPrev'], 15: ['mRight', 'cNext'],
  };
  const codeToActions = {};
  for (const a in KEYMAP) for (const c of KEYMAP[a]) (codeToActions[c] = codeToActions[c] || []).push(a);

  const I = B.I = {
    state: {}, hit: {}, up: {}, padPrev: {}, padNow: {},
    mouse: { x: 240, y: 135, moved: 0, inside: false, b0: false, b2: false },
    aimPad: { x: 0, y: 0 }, usingPad: false, anyHit: false, wheel: 0,
    // touch: a floating stick on the left, buttons on the right (layout from B.touchLayout in hud.js)
    touchMode: false, touch: { stick: null, mx: 0, my: 0, held: {}, ptrs: new Map(), refs: {} },
    down(a) { return !!(I.state[a] || I.padNow[a]); },
    pressed(a) { return !!(I.hit[a] || (I.padNow[a] && !I.padPrev[a])); },
    released(a) { return !!(I.up[a] || (!I.padNow[a] && I.padPrev[a])); },
    move() {
      let x = 0, y = 0;
      if (I.state.left) x -= 1; if (I.state.right) x += 1; if (I.state.up) y -= 1; if (I.state.down) y += 1;
      const p = I.pad;
      if (p) { const ax = p.axes[0] || 0, ay = p.axes[1] || 0; if (Math.abs(ax) > 0.18 || Math.abs(ay) > 0.18) { x += ax; y += ay; } }
      if (I.touch.stick) { x += I.touch.mx; y += I.touch.my; }
      const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
      return { x, y };
    },
    // Called once per fixed update, after the game has read edges.
    endTick() { I.hit = {}; I.up = {}; I.anyHit = false; I.wheel = 0; I.padPrev = I.padNow; },
    poll() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      let p = null; for (const g of pads) if (g && g.connected) { p = g; break; }
      I.pad = p; const now = {};
      if (p) {
        p.buttons.forEach((b, i) => { if (b.pressed && PADMAP[i]) for (const a of PADMAP[i]) now[a] = true; });
        const rx = p.axes[2] || 0, ry = p.axes[3] || 0;
        if (Math.hypot(rx, ry) > 0.3) { I.aimPad.x = rx; I.aimPad.y = ry; I.usingPad = true; }
        if (p.buttons.some(b => b.pressed) || Math.abs(p.axes[0] || 0) > 0.4) I.usingPad = true;
        if (p.buttons.some((b, i) => b.pressed && !(I.padPrev.__raw || [])[i])) I.anyHit = true;
        now.__raw = p.buttons.map(b => b.pressed);
      }
      I.padNow = now;
    },
    rumble(strong, weak, ms) {
      if (!B.settings.rumble) return;
      if (I.touchMode) { I.buzz(Math.min(ms, 200) * (strong > 0.5 ? 1 : 0.5)); return; }
      const p = I.pad; if (!p || !p.vibrationActuator) return;
      try { p.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak }); } catch (e) { /* unsupported */ }
    },
    buzz(ms) { if (I.touchMode && B.settings.rumble && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) { /* unsupported */ } },
  };
  function keyEvt(e, down) {
    const acts = codeToActions[e.code];
    if (acts || e.code === 'Tab' || e.code === 'Space') e.preventDefault();
    if (down && e.repeat) return;
    if (down) I.anyHit = true;
    I.usingPad = false;
    if (!acts) return;
    for (const a of acts) {
      if (down) { if (!I.state[a]) I.hit[a] = true; I.state[a] = true; }
      else { if (I.state[a]) I.up[a] = true; I.state[a] = false; }
    }
    if (down && B.onKey) B.onKey(e);
  }
  addEventListener('keydown', e => keyEvt(e, true));
  addEventListener('keyup', e => keyEvt(e, false));
  addEventListener('blur', () => { for (const a in I.state) if (I.state[a]) { I.state[a] = false; I.up[a] = true; } I.mouse.b0 = I.mouse.b2 = false; I.state.pick = false; I.state.listen = false; if (B.onBlur) B.onBlur(); });
  // a control named the way this player holds the game: B.k('Q', 'CLMP') -> 'Q' or 'CLMP'
  B.k = (key, thumb) => (I.touchMode ? thumb : key);
  B.bindMouse = function (canvas) {
    const toInternal = e => {
      const r = canvas.getBoundingClientRect(); const o = B.out || { x: 0, y: 0, w: r.width, h: r.height };
      I.mouse.x = (e.clientX - r.left - o.x) / o.w * B.W;
      I.mouse.y = (e.clientY - r.top - o.y) / o.h * B.H;
    };
    canvas.addEventListener('mousemove', e => { toInternal(e); I.mouse.moved = 1; I.usingPad = false; I.mouse.inside = true; });
    canvas.addEventListener('mousedown', e => {
      toInternal(e); I.anyHit = true; I.usingPad = false;
      if (e.button === 0) { I.mouse.b0 = true; I.hit.pick = true; I.state.pick = true; I.hit.click = true; }
      if (e.button === 2) { I.mouse.b2 = true; I.hit.listen = true; I.state.listen = true; }
      if (B.onGesture) B.onGesture();
    });
    addEventListener('mouseup', e => {
      if (e.button === 0) { I.mouse.b0 = false; I.up.pick = true; I.state.pick = false; }
      if (e.button === 2) { I.mouse.b2 = false; I.up.listen = true; I.state.listen = false; }
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { I.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
    addEventListener('keydown', () => { if (B.onGesture) B.onGesture(); });
    bindTouch(canvas, toInternal);
  };

  // Touch. Each finger is classified when it lands: on a button (from B.touchLayout), on the left
  // half (the floating stick), elsewhere in play (aim at that point), or outside play (a click).
  const T = I.touch;
  function press(a) { T.refs[a] = (T.refs[a] || 0) + 1; if (!I.state[a]) I.hit[a] = true; I.state[a] = true; }
  function release(a) { T.refs[a] = Math.max(0, (T.refs[a] || 0) - 1); if (!T.refs[a]) { if (I.state[a]) I.up[a] = true; I.state[a] = false; } }
  function bindTouch(canvas, toInternal) {
    const STICK = 26; // stick radius in 480-wide buffer pixels
    const sc = () => B.W / 480;
    const hitBtn = (lay, x, y) => { let best = null, bd = 1e9; for (const b of lay) { const d = Math.hypot(x - b.x, y - b.y) - (b.r + 6) * sc(); if (d < 0 && d < bd) { bd = d; best = b; } if (b.w && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; } return best; };
    const setActs = (t, acts) => { const old = t.acts || []; for (const a of acts) if (!old.includes(a)) press(a); for (const a of old) if (!acts.includes(a)) release(a); t.acts = acts; };
    canvas.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* synthetic */ }
      I.touchMode = true; I.usingPad = false; I.anyHit = true; I.mouse.inside = false;
      if (B.onGesture) B.onGesture();
      toInternal(e); const x = I.mouse.x, y = I.mouse.y;
      const lay = B.touchLayout ? B.touchLayout() : null;
      const t = { id: e.pointerId, x0: x, y0: y, x, y, t0: performance.now(), kind: 'click', acts: [] };
      if (lay) {
        const b = hitBtn(lay, x, y);
        if (b) { t.kind = 'btn'; t.btn = b; setActs(t, b.split ? (y < b.y + b.h / 2 ? b.acts : b.acts2) : b.acts); T.held[b.id] = true; I.buzz(8); }
        else if (x < B.W / 2 && !T.stick) { t.kind = 'stick'; T.stick = { id: e.pointerId, x0: x, y0: y, x, y }; T.mx = T.my = 0; }
        else { t.kind = 'aim'; I.mouse.inside = true; }
      } else {
        I.mouse.moved = 1; I.hit.click = true;
        if (B.mode === 'scene') { I.hit.confirm = true; }
      }
      T.ptrs.set(e.pointerId, t);
    }, { passive: false });
    canvas.addEventListener('pointermove', e => {
      const t = T.ptrs.get(e.pointerId); if (!t) return;
      e.preventDefault(); toInternal(e); t.x = I.mouse.x; t.y = I.mouse.y;
      if (t.kind === 'stick' && T.stick) {
        const s = T.stick, R = STICK * sc(); let dx = t.x - s.x0, dy = t.y - s.y0; const d = Math.hypot(dx, dy);
        // drag past the ring and the base follows the finger, like a trailing anchor
        if (d > R * 1.6) { s.x0 += dx / d * (d - R * 1.6); s.y0 += dy / d * (d - R * 1.6); dx = t.x - s.x0; dy = t.y - s.y0; }
        s.x = t.x; s.y = t.y; const n = Math.min(1, Math.hypot(dx, dy) / R);
        const l = Math.hypot(dx, dy) || 1; T.mx = dx / l * n; T.my = dy / l * n;
        setActs(t, Math.hypot(dx, dy) > R * 1.25 ? ['boost'] : []);
      } else if (t.kind === 'btn' && t.btn.split) setActs(t, t.y < t.btn.y + t.btn.h / 2 ? t.btn.acts : t.btn.acts2);
      else if (t.kind === 'aim') I.mouse.inside = true;
      else if (t.kind === 'click') I.mouse.moved = 1;
    }, { passive: false });
    const end = e => {
      const t = T.ptrs.get(e.pointerId); if (!t) return;
      T.ptrs.delete(e.pointerId); setActs(t, []);
      if (t.kind === 'btn') { T.held[t.btn.id] = false; if (t.btn.tap && performance.now() - t.t0 < 450) t.btn.tap(); }
      if (t.kind === 'stick') { T.stick = null; T.mx = T.my = 0; }
      if (t.kind === 'aim' && ![...T.ptrs.values()].some(o => o.kind === 'aim')) I.mouse.inside = false;
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    // a real mouse moving again hands control back to the mouse
    canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && I.touchMode && Math.abs(e.movementX) + Math.abs(e.movementY) > 3) I.touchMode = false; });
  }

  // ---------------------------------------------------------------- persistence
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };
  B.store = store;
  const SET_DEF = { master: 0.8, music: 0.7, crt: true, photo: false, honest: false, steady: false, captions: true, rumble: true, shake: true, markers: true, difficulty: 1, quality: 1, qualityChecked: false };
  B.settings = Object.assign({}, SET_DEF, store.get('benthos.settings', {}));
  for (const k in B.settings) if (!(k in SET_DEF) || typeof B.settings[k] !== typeof SET_DEF[k]) B.settings[k] = SET_DEF[k];
  B.saveSettings = () => store.set('benthos.settings', B.settings);
  // Difficulty: 0 story, 1 diver, 2 abyssal. Scales air use, damage taken and crush accumulation.
  B.DIFF = [{ name: 'STORY', air: 0.6, hurt: 0.5, crush: 0.6 }, { name: 'DIVER', air: 1, hurt: 1, crush: 1 }, { name: 'ABYSSAL', air: 1.3, hurt: 1.4, crush: 1.3 }];
  B.diff = () => B.DIFF[M.clamp(B.settings.difficulty | 0, 0, 2)];
  B.meta = Object.assign({ deaths: 0, endings: [], ngplus: false, runs: 0 }, store.get('benthos.meta', {}));
  B.saveMeta = () => store.set('benthos.meta', B.meta);
})(window.B);
</script>
<script>/* src/palette.js */
/* palette.js — the Halvard-48 master palette, the zone subsets that shrink with depth, and the
 * 32x32x32 lookup tables that map lit colour to the nearest palette entry. */
'use strict';
(function (B) {
  const C = {
    k0: '#000000',
    b0: '#02060e', b1: '#050d1a', b2: '#091728', b3: '#0e2338', b4: '#14324c', b5: '#1c4563', b6: '#275a7c',
    b7: '#357396', b8: '#4a8fb0', b9: '#69aac6', b10: '#93c8da', b11: '#c4e6ee',
    t0: '#06201f', t1: '#0c3530', t2: '#14504a', t3: '#1f6e63', t4: '#2f907c', t5: '#4bb394', t6: '#7dd6b0', t7: '#bff3d6',
    c0: '#18225e', c1: '#2c3fa8', c2: '#5a74e6',
    s0: '#e8fff8',
    w0: '#140c08', w1: '#2a1a10', w2: '#452c1a', w3: '#664329', w4: '#8a5d3a', w5: '#b07d52', w6: '#d3a46f', w7: '#f0cc98',
    r0: '#2e0b0b', r1: '#5c1414', r2: '#922218', r3: '#c83a22',
    o0: '#ff8f2a', o1: '#ffc05e',
    a0: '#2a1a05', a1: '#7a4b0f', a2: '#d98e1c', a3: '#ffd27a',
    p0: '#c8708f', p1: '#f2b8cb',
    g0: '#16161b', g1: '#2c2c33', g2: '#4a4a52', g3: '#6f6f78', g4: '#9a9aa2', g5: '#c8c8cd', g6: '#efefec',
    k1: '#2c3a1a', k2: '#4d6128', k3: '#7a8f3b',
  };
  B.C = C;
  const list = s => s.split(' ').map(k => C[k]);

  // Zone palettes. The world renders through one of these; the HUD and sonar draw on top in exact colours.
  const Z = {
    top: Object.values(C),
    sun: list('k0 b1 b2 b3 b4 b5 b6 b7 b8 b9 b10 b11 t1 t2 t3 t4 t5 t6 w1 w2 w3 w4 w5 w6 w7 r2 r3 o0 g1 g3 g5 k2'),
    twi: list('k0 b0 b1 b2 b3 b4 b5 b6 b7 b8 b9 t1 t2 t3 t4 t5 t6 w1 w2 w4 w6 r2 o0 g3'),
    deep: list('k0 b0 b1 b2 b3 b5 b7 b9 t1 t3 t5 t6 w2 w6 r1 o0'),
    mid: list('k0 b0 b1 b2 b4 b6 b8 t2 t4 t6 c1 c2 p1 o0 o1 w6'),
    mid2: list('k0 b0 b1 b3 b5 t2 t5 c1 p1 o0 o1 w5'),
    ben0: list('k0 b0 b2 b4 t2 t5 c1 o0 w4 g4'),
    ben1: list('k0 b0 b2 t2 t5 c1 w4 g4'),
    ben2: list('k0 b1 t2 t5 w4 g4'),
    ben3: list('k0 b1 t4 g4'),
    ben4: list('k0 b2 g4'),
    red: list('k0 r0 r1 r2 r3'),
    listen: list('k0 b2 b4 b6'),
    eye: ['#000000', '#e6e6e0'],
    d71: ['#2b1830', '#7a4a6e', '#6fa3a8', '#d6c3b5'],
    d94: ['#1a1408', '#3d6b2a', '#b8332a', '#e0d090'],
    dmara: ['#0a0a12', '#3a2a4a', '#8a6a5a', '#c0b0a0'],
  };
  B.ZONES = Z;

  // Mara's own 16-colour ramp. Fidelity merges these one at a time (see DESIGN.md §2.2.3).
  B.DIVER = ['#1a1d22', '#3a3f47', '#646b75', '#9aa2ab', '#d4d9dd', '#0b1a1f', '#1f4650', '#7fc4cf',
    '#6a3e2c', '#b9805e', '#e8b892', '#7a4b0f', '#ffb43a', '#2a3a35', '#8fe0c0', '#3b2a22'];
  // [from, into] for fidelity 16 -> 15, 15 -> 14, ... down to 3. The amber stencil survives longest.
  B.DIVER_MERGE = [[10, 9], [7, 6], [4, 3], [9, 8], [15, 1], [13, 5], [8, 5], [0, 1], [6, 5], [3, 2], [2, 1], [14, 5], [11, 12]];
  B.diverMap = function (fid) {
    const map = []; for (let i = 0; i < 16; i++) map[i] = i;
    const steps = 16 - Math.max(3, Math.min(16, fid));
    for (let s = 0; s < steps; s++) {
      const [a, b] = B.DIVER_MERGE[s];
      for (let i = 0; i < 16; i++) if (map[i] === a) map[i] = map[b];
    }
    return map;
  };

  const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  B.hexRGB = hexRGB;
  B.rgb32 = (r, g, b, a) => ((a === undefined ? 255 : a) << 24 | b << 16 | g << 8 | r) >>> 0;

        const tx = flee ? this.x + (this.x - Pp.x) * 2 : this.x + Math.cos(this.yaw + Math.sin(this.t * 0.3) * 1.5) * 4;
        const ty = flee ? this.y + (this.y - Pp.y) * 2 : this.y + Math.sin(this.yaw + Math.sin(this.t * 0.3) * 1.5) * 4;
        const tz = this.z + Math.sin(this.t * 0.2 + this.id) * 1.5;
        steer(this, tx, ty, tz, flee ? 2.4 : (Math.sin(this.t * 1.3) > 0.6 ? 1.2 : 0.3), 1.5, dt, 2);
        avoid(this, 0.8, dt);
      },
      draw() { R.model(this.x, this.y, this.z, MD.squid({ yaw: this.yaw, kind: this.kind, stunned: this.stunned > 0 || this.dead }), { dim: this.dead ? 0.6 : 1 }); },
      interact: { label: () => (s.stunned > 0 || s.dead) ? 'ABSORB (HOLD)' : null, hold: 1.2, fn() { B.Player.absorb(s, s.kind === 'mourning' ? 'bloom' : 'siphon'); s.alive = false; } },
    });

  };
  // A carcass whose scavengers yield a strain (whale fall slimewives -> Caul; the Sleeper's pickled body -> Graft).
  E.carcass = function (x, y, z, strain, charges, o) {
    const cc = E.add(Object.assign({
      type: 'carcass', x, y, z, strain, charges, yaw: 0.6, t: 0, r: 2, anchor: true,
      update(dt) { this.t += dt; },
      draw() {
        if (this.model !== false) R.model(this.x, this.y, this.z, MD.carcass({ yaw: this.yaw }), {});
        if (this.wives) for (let k = 0; k < Math.max(1, this.charges + 2); k++) R.model(this.x + Math.cos(k * 2.1) * 2.2, this.y + Math.sin(k * 1.7) * 1.2, this.z - 0.4, MD.slimewife({ yaw: k * 1.3, t: this.t + k }), {});
      },
      interact: { label: () => cc.charges > 0 ? 'ABSORB ' + (cc.strain === 'caul' ? 'SLIMEWIFE MUCUS' : 'BIOMASS') + ' (HOLD)' : null, hold: 1.2, fn() { if (cc.charges > 0 && B.Player.absorb(cc, cc.strain)) cc.charges--; } },
    }, o));

  };
  // Lanternfish swarm in the Phantom Floor: brushing through it sets off the burglar alarm.
  E.lanterns = function (x, y, z, n) {
    const P2 = []; for (let k = 0; k < n; k++) P2.push({ x: x + M.rnd(-12, 12), y: y + M.rnd(-12, 12), z: z + M.rnd(-8, 8), a: Math.random() * 6.28 });
    return E.add({
      type: 'lanterns', x, y, z, P: P2, cool: 0, layer: 3,
      update(dt) {
        const Pp = pl(); if (!Pp) return; this.cool -= dt;
        const ps = Math.hypot(Pp.vx, Pp.vy, Pp.vz);
        for (const f of this.P) {
          f.a += dt * 0.6; f.x += Math.cos(f.a) * dt * 0.4; f.y += Math.sin(f.a * 0.8) * dt * 0.4;
          const d = Math.hypot(f.x - Pp.x, f.y - Pp.y, f.z - Pp.z);
          if (d < 2.5) { f.x += (f.x - Pp.x) / d * dt * 3; f.y += (f.y - Pp.y) / d * dt * 3; if (ps > 1.2 && d < 1.2 && this.cool <= 0) { this.cool = 25; E.alarm(Pp.x, Pp.y, Pp.z); B.Story && B.Story.onAlarm && B.Story.onAlarm(); } }
        }
      },
      draw() { for (const f of this.P) { const tw = 0.6 + 0.4 * Math.sin(B.time * 3 + f.a * 5); R.point(f.x, f.y, f.z, 1, 0.15 * tw, 0.5 * tw, 1.1 * tw, 2); } },
    });
  };
  // Small reef fish in the sunlit zone.
  E.fish = function (x, y, z, n, hex) {
    const P2 = [], cc = B.linHex(hex || '#d8d0a0'); for (let k = 0; k < n; k++) P2.push({ x: x + M.rnd(-3, 3), y: y + M.rnd(-3, 3), z: z + M.rnd(-2, 2), vx: 0, vy: 0 });
    return E.add({
      type: 'fish', x, y, z, P: P2, a: Math.random() * 6.28,
      update(dt) {
        const Pp = pl(); if (!Pp) return;
        this.a += dt * 0.3; const cx = x + Math.cos(this.a) * 6, cy = y + Math.sin(this.a * 1.3) * 5;
        for (const f of this.P) {
          const d = Math.hypot(f.x - Pp.x, f.y - Pp.y, f.z - Pp.z);
          let ax = (cx - f.x) * 0.5, ay = (cy - f.y) * 0.5; if (d < 4) { ax += (f.x - Pp.x) * 3; ay += (f.y - Pp.y) * 3; }
          f.vx = (f.vx + ax * dt) * 0.96; f.vy = (f.vy + ay * dt) * 0.96; f.x += f.vx * dt; f.y += f.vy * dt;
        }
      },
      draw() { for (const f of this.P) R.point(f.x, f.y, f.z, 1, cc[0], cc[1], cc[2], false); },
    });
  };

  // ================================================================== THE SECOND DIVER
  // Replays a slice of the player's recorded movement, offset in space. Pings it makes lay real trails.
  E.ghost = function (startFrame, frames, offX, offY, offZ) {
    const g = E.add({
      type: 'ghost', x: 0, y: 0, z: 0, f: 0, frames, startFrame, offX, offY, offZ, trail: [], ring: 0, yaw: 0, kick: 0, lamp: 'white',
      update(dt) {
        const rec = B.Player.recFrame(this.startFrame + Math.floor(this.f)); this.f += dt * 60;
        if (!rec || this.f > this.frames) { this.alive = false; return; }
        this.x = rec[0] + this.offX; this.y = rec[1] + this.offY; this.z = rec[2] + this.offZ; this.yaw = rec[3]; this.kick = rec[4];
        this.lamp = rec[5] === 1 ? 'white' : rec[5] === 2 ? 'red' : 'off';
        if (rec[6] === 1) { const ev = B.noise(this.x, this.y, this.z, 120, 'ghostping'); if (ev) ev.src = this; this.ring = 10; A.at('ping', this.x, this.y, this.z, 0.8); }
        if (this.ring > 0) { this.ring -= dt; if (B.frame % 15 === 0) this.trail.push({ x: this.x, y: this.y, z: this.z, t: B.time }); }
        this.trail = this.trail.filter(n => B.time - n.t < 12);
        const Pp = pl(); if (Pp) B.flange = Math.max(B.flange || 0, Math.hypot(this.x - Pp.x, this.y - Pp.y, this.z - Pp.z) < 10 ? 1 : 0);
      },
      draw() {
        const st = B.Player.state(), L = B.lensOn;
        if (L && Math.hypot(L.x - R.sx(this.x), L.y - R.sy(this.y, this.z)) < L.r) return; // the lens sees no copy
        R.model(this.x, this.y, this.z, MD.diver({ yaw: MD.quant8(this.yaw), t: B.time, kick: this.kick, lamp: this.lamp, fill: 0.5, tankCol: [0.35, 0.05, 0.4] }), { scale: st.res, lut: 1, flip: st.flipped && Math.cos(this.yaw) < -0.3 });
        if (this.lamp === 'white') R.addLight(this.x + Math.cos(this.yaw) * 2, this.y + Math.sin(this.yaw) * 2, this.z + 1, 1, 0.9, 0.8, 8, 0.8);
      },
    });
    return g;
  };
  // Act III: the copy has mass. It closes in from outside the light and holds on.
  E.double = function (x, y, z) {
    const d = E.add({
      type: 'double', x, y, z, yaw: 0, pitch: 0, mode: 'stalk', holdT: 0, cool: 0, r: 0.9, shadow: true, t: 0, stolen: 0,
      update(dt) {
        const Pp = pl(); if (!Pp) return; this.t += dt;
        const dp = dist(this, Pp.x, Pp.y, Pp.z), lit = E.inLamp(this.x, this.y, this.z, 14) > 0;
        B.flange = Math.max(B.flange || 0, dp < 10 ? 1 : 0);
        if (this.mode === 'stun') { if ((this.cool -= dt) <= 0) this.mode = 'stalk'; this.z += dt * 0.2; return; }
        if (this.mode === 'away') { steer(this, this.x + (this.x - Pp.x), this.y + (this.y - Pp.y), this.z, 2, 2, dt); if ((this.cool -= dt) <= 0) { this.mode = 'stalk'; } return; }
        if (this.mode === 'hold') {
          this.x = Pp.x - Math.cos(Pp.yaw) * 0.5; this.y = Pp.y - Math.sin(Pp.yaw) * 0.5; this.z = Pp.z;
          this.holdT += dt;
          if (B.Player.state().caul > 0) { this.mode = 'away'; this.cool = 12; B.Player.say('mara', 'IT SLID OFF.'); return; }
          if (this.holdT > 4) { B.Player.loseFidelity(2, 'double'); this.stolen += 2; this.mode = 'away'; this.cool = 20; }
          return;
        }
        // stalk from outside the lamp; rush when close
        if (lit && dp > 5) { const a = Math.atan2(this.y - Pp.y, this.x - Pp.x) + 0.8; steer(this, Pp.x + Math.cos(a) * 16, Pp.y + Math.sin(a) * 16, Pp.z, 1.6, 2, dt); }
        else steer(this, Pp.x, Pp.y, Pp.z, dp < 8 ? 2.6 : 1.2, 2, dt);
        avoid(this, 1, dt);
        if (dp < 1.4 && (this.cool -= dt) <= 0) { this.mode = 'hold'; this.holdT = 0; A.sfx('knock'); B.Player.grabbed(this); }
      },
      shake() { if (this.mode === 'hold') { this.holdT -= 0.25; if (this.holdT < -0.5) { this.mode = 'away'; this.cool = 10; } } },
      stun() { this.mode = 'stun'; this.cool = 15; },
      draw() {
        const st = B.Player.state();
        R.model(this.x, this.y, this.z, MD.diver({ yaw: MD.quant8(this.yaw), t: this.t, kick: 0.8, lamp: 'off', fill: 0.8, tankCol: [0.4, 0.05, 0.3], growth: 0.6 }), { scale: st.res, lut: 1 });
        if (B.Player.revealed(this)) R.wire(this.x, this.y, this.z, MD.diver({ yaw: this.yaw, plain: [] }), B.SONAR, st.res);
      },
    });
    return d;
  };
})(window.B);
</script>
<script>/* src/life.js */
/* life.js — the ambient ecosystem. Three layers, none of them scripted:
 *  1. Wake light: dinoflagellates flare where anything moves fast, the diver's fins and the things
 *     hunting her alike, so a blue smear in the dark is sometimes the only warning.
 *  2. Drifters: mid-water animals kept in a loose ring around the diver and recycled as she moves.
 *     Most are invisible until the lamp finds them; a few make their own light.
 *  3. Benthos: seabed fauna scattered over whatever floor is in view, placed by a hash of the ground
 *     cell so a sea pen is still there when you come back for it. */
'use strict';
(function (B) {
  const M = B.M, R = B.R, E = B.E, MD = B.MD, P = R.P;
  const Lf = B.Life = {};
  const cache = {}, c = h => cache[h] || (cache[h] = B.linHex(h));
  const H = (x, y) => B.World.H(B.map, x, y);
  const pl = () => B.player;
  const AXV = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];

  // ------------------------------------------------------------------ 1. wake light
  const SMAX = 420, SX = new Float32Array(SMAX), SY = new Float32Array(SMAX), SZ = new Float32Array(SMAX);
  const SVX = new Float32Array(SMAX), SVY = new Float32Array(SMAX), SVZ = new Float32Array(SMAX);
  const SA = new Float32Array(SMAX), SL = new Float32Array(SMAX), SC = new Uint8Array(SMAX);
  let sn = 0;
  // colour per kind: dinoflagellate blue-green, sea-pen violet, bamboo-coral blue, pyrosome blue-white
  const SCOL = [[0.12, 0.75, 1.1], [0.6, 0.25, 1.2], [0.15, 0.45, 1.4], [0.5, 0.8, 1.4]];
  Lf.spark = function (x, y, z, vx, vy, vz, life, kind) {
    if (sn >= SMAX) return;
    SX[sn] = x; SY[sn] = y; SZ[sn] = z; SVX[sn] = vx; SVY[sn] = vy; SVZ[sn] = vz; SA[sn] = 0; SL[sn] = life; SC[sn] = kind || 0; sn++;
  };
  Lf.burst = function (x, y, z, n, spread, kind) {
    for (let k = 0; k < n; k++) Lf.spark(x + M.rnd(-spread, spread), y + M.rnd(-spread, spread), z + M.rnd(-spread, spread) * 0.6, M.rnd(-0.4, 0.4), M.rnd(-0.4, 0.4), M.rnd(-0.2, 0.2), M.rnd(0.6, 1.6), kind);
  };
  // how much living light there is at a depth: none in the sunlit zone, most in the mid-water
  function wakeDensity(z) { if (B.act === 'deck' || z < 180) return 0; if (z < 300) return (z - 180) / 120; if (B.act === 'act3') return 0.45; return 1; }
  const HUNTERS = { sleeper: 1, reliquary: 1, squid: 0.6, double: 1, grain: 0.4, ghost: 0.8 };
  function sparksUpdate(dt) {
    const Pp = pl();
    if (Pp && !Pp.dead && !B.Story.hideBody) {
      const dens = wakeDensity(Pp.z), sp = Math.hypot(Pp.vx, Pp.vy, Pp.vz);
      const rate = dens * (Pp.thrust * 26 + (Pp.boost ? 40 : 0) + Math.max(0, sp - 1.2) * 20);
      let n = rate * dt; while (n > 0) {
        if (Math.random() < n) {
          const back = 0.55 + Math.random() * 0.35, cy = Math.cos(Pp.yaw), sy = Math.sin(Pp.yaw), side = M.rnd(-0.25, 0.25);
          Lf.spark(Pp.x - cy * back - sy * side, Pp.y - sy * back + cy * side, Pp.z + M.rnd(0, 0.5), -cy * 0.6 + M.rnd(-0.3, 0.3), -sy * 0.6 + M.rnd(-0.3, 0.3), M.rnd(-0.15, 0.15), M.rnd(0.7, 1.7), 0);
        }
        n -= 1;
      }
      // anything big moving fast through living water lights it up
      for (const e of E.list) {
        const w = e.alive && HUNTERS[e.type]; if (!w) continue;
        const ev = Math.hypot(e.vx || 0, e.vy || 0, e.vz || 0); if (ev < 0.8) continue;
        const d = Math.hypot(e.x - Pp.x, e.y - Pp.y); if (d > 40) continue;
        const dz = wakeDensity(e.z); if (Math.random() < dt * ev * 14 * w * dz) Lf.spark(e.x + M.rnd(-0.8, 0.8), e.y + M.rnd(-0.8, 0.8), e.z + M.rnd(-0.6, 0.6), -e.vx * 0.2, -e.vy * 0.2, 0, M.rnd(0.8, 1.8), 0);
      }
    }
    for (let k = 0; k < sn; k++) {
      SA[k] += dt;
      if (SA[k] >= SL[k]) { sn--; SX[k] = SX[sn]; SY[k] = SY[sn]; SZ[k] = SZ[sn]; SVX[k] = SVX[sn]; SVY[k] = SVY[sn]; SVZ[k] = SVZ[sn]; SA[k] = SA[sn]; SL[k] = SL[sn]; SC[k] = SC[sn]; k--; continue; }
      const dr = Math.exp(-dt * 2.2); SVX[k] *= dr; SVY[k] *= dr; SVZ[k] *= dr;
      SX[k] += SVX[k] * dt; SY[k] += SVY[k] * dt; SZ[k] += SVZ[k] * dt;
    }
  }
  function sparksDraw() {
    for (let k = 0; k < sn; k++) {
      const a = SA[k] / SL[k], fl = a < 0.12 ? a / 0.12 : (1 - a) * (1 - a) * 1.3, tw = 0.75 + 0.25 * Math.sin(SA[k] * 31 + k);
      const col = SCOL[SC[k]], kk = fl * tw * 0.55;
      R.point(SX[k], SY[k], SZ[k], 1, col[0] * kk, col[1] * kk, col[2] * kk, 2);
    }
  }

  // ------------------------------------------------------------------ 2. drifters
  // weights per depth band: [atolla, comb, siphonophore, lanternfish, pyrosome, dragonfish]
  function drifterTable(z) {
    if (B.act === 'act3') return { n: 5, w: [3, 1, 1, 0, 1, 0] };
    if (z < 200) return { n: 0, w: [0, 0, 0, 0, 0, 0] };
    if (z < 420) return { n: 7, w: [0, 4, 1, 5, 0, 0] };
    if (z < 1000) return { n: 11, w: [2, 3, 2, 4, 1, 0] };
    if (z < 2000) return { n: 14, w: [3, 3, 3, 3, 2, 1] };
    return { n: 12, w: [3, 2, 3, 2, 2, 1] };
  }
  const KINDS = ['atolla', 'comb', 'siph', 'lfish', 'pyro', 'dragon'];
  function pick(w) { let t = 0; for (const v of w) t += v; let r = Math.random() * t; for (let k = 0; k < w.length; k++) { r -= w[k]; if (r <= 0) return k; } return 0; }
  const lit = (x, y, z) => R.lightAt(x, y, z);
  // Is the lamp beam on this point (and close enough to matter)?
  function inBeam(x, y, z, range) {
    const L = R.env.lamp; if (!L.on) return 0;
    const dx = x - L.x, dy = y - L.y, dz = z - L.z, d = Math.hypot(dx, dy, dz); if (d > (range || Math.sqrt(L.r2))) return 0;
    return (dx * L.dx + dy * L.dy + dz * L.dz) / (d || 1) > L.cosO ? 1 - d / Math.sqrt(L.r2) : 0;
  }
  function hue(h) { h = ((h % 1) + 1) % 1; const k = n => { const v = (n + h * 6) % 6; return Math.max(0, Math.min(1, Math.min(v, 4 - v))); }; return [k(5), k(3), k(1)]; }

  const DR = {
    atolla: {
      init(d) { d.r = M.rnd(0.35, 0.6); d.alarm = 0; d.ph = Math.random() * 6; },
      update(d, dt, Pp) {
        d.ph += dt * 1.6; d.z += Math.sin(d.ph) * dt * 0.08;
        const near = Math.hypot(d.x - Pp.x, d.y - Pp.y, d.z - Pp.z);
        if (d.alarm <= 0 && (near < 3.5 || inBeam(d.x, d.y, d.z, 9) > 0.15)) { d.alarm = 5; B.A && B.A.at && B.A.at('jelly', d.x, d.y, d.z, 0.4); }
        d.alarm -= dt;
      },
      draw(d) {
        const pulse = 1 - Math.max(0, Math.sin(d.ph)) * 0.18, r = d.r * pulse;
        if (lit(d.x, d.y, d.z) > 0.02) R.model(d.x, d.y, d.z, [P.e(0, 0, 0, AXV, [r, r, r * 0.35], c('#5c1414'), { m: 1 }), P.e(0, 0, -r * 0.2, AXV, [r * 0.45, r * 0.45, r * 0.3], c('#922218'), { m: 1 })], { outline: false });
        // the pinwheel: a rotating wave of blue around the rim, the "burglar alarm" that calls bigger things
        const n = 20, al = d.alarm > 0;
        for (let k = 0; k < n; k++) {
          const a = k / n * Math.PI * 2, wave = al ? Math.max(0, Math.cos(a - B.time * 9)) ** 3 : (0.3 + 0.2 * Math.sin(B.time * 0.7 + k)) * 0.55;
          const kk = (al ? 1.6 * Math.min(1, d.alarm / 1.5) : 1) * wave; if (kk < 0.03) continue;
          R.point(d.x + Math.cos(a) * r * 1.05, d.y + Math.sin(a) * r * 1.05, d.z, 1, 0.12 * kk, 0.45 * kk, 1.3 * kk, 2);
        }
      },
    },
    comb: {
      init(d) { d.len = M.rnd(0.18, 0.32); d.yaw = Math.random() * 6.28; d.ph = Math.random() * 6; },
      update(d, dt) { d.ph += dt; d.yaw += Math.sin(d.ph * 0.3) * dt * 0.2; d.x += Math.cos(d.yaw) * dt * 0.05; d.y += Math.sin(d.yaw) * dt * 0.05; },
      draw(d) {
        const L = lit(d.x, d.y, d.z); if (L < 0.015) return;
        const T = MD.frame(d.yaw, -1.2), a = d.len, k = Math.min(1, L * 3);
        R.model(d.x, d.y, d.z, [P.e(...T(0, 0, 0), [T(1, 0, 0), T(0, 1, 0), T(0, 0, 1)], [a, a * 0.62, a * 0.62], c('#a8c8d0'), { m: 1 })], { outline: false, alpha: 0.55 });
        // eight comb rows scatter the lamp into running rainbows
        for (let r = 0; r < 8; r++) {
          const th = r / 8 * Math.PI * 2;
          for (let s = 1; s < 6; s++) {
            const u = -a + s / 6 * 2 * a, rad = Math.sqrt(Math.max(0, 1 - (u / a) ** 2)) * a * 0.64;
            const p = T(u, Math.cos(th) * rad, Math.sin(th) * rad), col = hue(r / 8 + s * 0.08 - B.time * 1.4), kk = k * 0.9;
            R.point(d.x + p[0], d.y + p[1], d.z + p[2], 1, col[0] * kk, col[1] * kk, col[2] * kk, 2);
          }
        }
      },
    },
    siph: {
      init(d) { d.n = 10 + Math.floor(Math.random() * 18); d.yaw = Math.random() * 6.28; d.slope = M.rnd(-0.3, 0.3); d.ph = Math.random() * 10; d.pulse = -1; },
      update(d, dt, Pp) {
        d.ph += dt; d.yaw += Math.sin(d.ph * 0.13) * dt * 0.05; d.x += Math.cos(d.yaw) * dt * 0.08; d.y += Math.sin(d.yaw) * dt * 0.08;
        if (d.pulse < 0 && (Math.random() < dt * 0.08 || (Math.hypot(d.x - Pp.x, d.y - Pp.y, d.z - Pp.z) < 6 && Math.random() < dt * 0.8))) d.pulse = 0;
        if (d.pulse >= 0) { d.pulse += dt * 9; if (d.pulse > d.n + 6) d.pulse = -1; }
      },
      node(d, k) { const t = k * 0.32, w = Math.sin(t * 0.6 + d.ph * 0.5) * 0.6; return [d.x + Math.cos(d.yaw) * t - Math.sin(d.yaw) * w, d.y + Math.sin(d.yaw) * t + Math.cos(d.yaw) * w, d.z + t * d.slope + Math.sin(t * 0.4 + d.ph) * 0.3]; },
      draw(d) {
        const L = lit(d.x, d.y, d.z);
        let prev = null;
        for (let k = 0; k < d.n; k++) {
          const p = DR.siph.node(d, k), wave = d.pulse >= 0 ? Math.max(0, 1 - Math.abs(k - d.pulse) / 2.5) : 0, base = k === 0 ? 0.7 : 0.14 + 0.06 * Math.sin(B.time * 2 + k);
          const kk = base + wave * 1.4;
          R.point(p[0], p[1], p[2], 1, 0.15 * kk, 0.5 * kk, 1.2 * kk, 2);
          if (L > 0.02 && prev) R.line(prev[0], prev[1], prev[2], p[0], p[1], p[2], 0.6, 0.55, 0.5, false, 0.5);
          prev = p;
        }
      },
    },

    } else if (P.clamped || P.braced) { P.vx *= 0.8; P.vy *= 0.8; P.vz *= 0.8; }
    if (P.tangled) {
      P.vx = P.vy = 0; P.vz = -0.3;
      if (mag > 0.5 && (P.strT = (P.strT || 0) - dt) <= 0) { P.strT = 0.35; P.grip -= 0.08; B.noise(P.x, P.y, P.z, 40, 'struggle'); A.sfx('glass'); }
      P.crush = Math.min(100, P.crush + 2 * dt); P.tangleT = (P.tangleT || 0) + dt;
      if (P.grip <= 0 || !P.tangled.alive) { P.tangled = null; P.tangleT = 0; Pm.say('hud', 'FREE'); P.vx = -P.aimX * 2; P.vy = -P.aimY * 2; }
      else if (P.tangleT > 25 || P.crush >= 100) { P.tangled = null; P.tangleT = 0; Pm.die('procession'); return; }
    }
    if (P.grabbed) { P.vx = P.vy = P.vz = 0; if (mag > 0.5) P.grabbed.shake(); if (!P.grabbed.alive || P.grabbed.mode !== 'hold') P.grabbed = null; }
    // integrate
    const ox = P.x, oy = P.y, oz = P.z;
    if (!P.inCage) { P.x += P.vx * dt; P.y += P.vy * dt; P.z += P.vz * dt; }
    collide(ox, oy, oz);
    // ----- systems
    lamp(dt);
    breathe(dt);
    pressure(dt);
    biomass(dt);
    sonarTick(dt);
    // ----- actions
    if (!lock) actions(dt);
    interactScan(dt, lock);
    recordFrame();
  };

  function collide(ox, oy, oz) {
    const m = B.map;
    P.x = M.clamp(P.x, 2, m.size - 2); P.y = M.clamp(P.y, 2, m.size - 2);
    if (P.z < 1.2 && !B.Story.surfacing) { P.z = 1.2; if (P.vz < 0) P.vz = 0; }
    if (B.Story.noclip) return; // the ledge giving way under her
    let impact = 0;
    // walls: ring samples around the body at hip and chest height
    for (let a = 0; a < 8; a++) {
      const cx = Math.cos(a * 0.785), cy = Math.sin(a * 0.785);
      const hz = Math.min(H(P.x + cx * 0.75, P.y + cy * 0.75), H(P.x + cx * 0.6, P.y + cy * 0.6));
      if (hz < P.z + 0.5) {
        const pen = 0.75 - 0.0; P.x -= cx * 0.08; P.y -= cy * 0.08;
        const vd = P.vx * cx + P.vy * cy; if (vd > 0) { impact = Math.max(impact, vd); P.vx -= cx * vd * 1.15; P.vy -= cy * vd * 1.15; }
        void pen;
      }
    }
    const f = H(P.x, P.y);
    if (f < P.z + 1.15) {
      if (f > P.z - 1.5) { if (P.vz > 0) { impact = Math.max(impact, P.vz); P.vz = -P.vz * 0.15; } P.z = f - 1.15; }
      else { P.x = ox; P.y = oy; P.z = Math.min(P.z, oz); P.vx *= -0.2; P.vy *= -0.2; }
    }
    // solid props
    for (const e of E.list) {
      if (!e.alive || !e.solid) continue;
      const dx = P.x - e.x, dy = P.y - e.y, dz = (P.z - e.z) * (e.flatZ || 1), d = Math.hypot(dx, dy, dz), rr = e.r + 0.8;
      if (d < rr && d > 0.001) { const k = (rr - d) / d; P.x += dx * k; P.y += dy * k; P.z += dz * k / (e.flatZ || 1); const vd = -(P.vx * dx + P.vy * dy + P.vz * dz) / d; if (vd > 0) { impact = Math.max(impact, vd); P.vx += dx / d * vd; P.vy += dy / d * vd; P.vz += dz / d * vd; } }
    }
    if (impact > 2.5) {
      P.crush = Math.min(100, P.crush + (impact - 2.5) * 9); A.sfx('impact'); B.shake(8); B.noise(P.x, P.y, P.z, 70, 'impact');
      E.silt(P.x, P.y, f - 0.5, 1); if (P.crush >= 100) Pm.die('impact');
    } else if (impact > 1.2 && f - P.z < 2) { E.silt(P.x, P.y, f - 0.4, 0.4); }
    // kicking near a silty floor stirs a little plume
    if (P.thrust > 0.6 && f - P.z < 1.8 && Math.random() < 0.02) E.silt(P.x, P.y, f - 0.4, 0.3);
  }

  function walk(dt) {
    const lock = B.Story.locked || B.Hud.capture(), mv = lock ? { x: 0, y: 0 } : I.move();
    const sp = 2.2, nx = P.x + mv.x * sp * dt, ny = P.y + mv.y * sp * dt;
    const ok = (x, y) => { const h = H(x, y); return h > -3.4 && h < -2.6; };
    if (ok(nx, P.y)) P.x = nx; if (ok(P.x, ny)) P.y = ny;
    for (const e of E.list) if (e.alive && e.solid) { const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy), rr = e.r + 0.35; if (d < rr && d > 0.01) { P.x += dx / d * (rr - d); P.y += dy / d * (rr - d); } }
    if (Math.hypot(mv.x, mv.y) > 0.1) P.yaw = Math.atan2(mv.y, mv.x);
    P.walk = Math.hypot(mv.x, mv.y); P.z = -3.9;
    R.env.lamp.on = false;
    interactScan(dt, lock);
  }

  function lamp(dt) {
    const L = R.env.lamp;
    L.on = P.powered && !P.braced && P.lampMode !== 'off' && P.rebootT <= 0;
    const tilt = 0.72, ct = Math.cos(tilt);
    L.x = P.x + Math.cos(P.yaw) * 0.25; L.y = P.y + Math.sin(P.yaw) * 0.25; L.z = P.z - 0.95;
    L.dx = P.aimX * ct; L.dy = P.aimY * ct; L.dz = Math.sin(tilt);
    let k = 3.4;
    if (P.caul > 0) k *= 0.4;
    if (E.inSilt(P.x, P.y, P.z)) k *= 0.3;
    if (B.Z.flicker > 0) k *= Math.random() < 0.5 ? 0 : 1;
    L.mode = P.lampMode;
    if (P.lampMode === 'red') { L.cosO = Math.cos(0.66); L.cosI = Math.cos(0.46); L.r2 = 49; L.i = 2.6 * (k / 3.4); L.cr = 1; L.cg = 0.08; L.cb = 0.04; }
    else { L.cosO = Math.cos(0.5); L.cosI = Math.cos(0.3); L.r2 = 400; L.i = k; L.cr = 1; L.cg = 0.93; L.cb = 0.8; }
  }

  function breathe(dt) {
    const panic = B.danger > 0;
    let mult = (P.boost ? 2 : P.thrust > 0.2 ? 1.3 : 1) * (panic ? 1.4 : 1) * (P.breathHold ? 0.6 : 1);
    P.o2 -= dt * mult * B.diff().air;
    if (P.relics.lung) { P.lungT += dt; if (P.lungT > 60) { P.lungT = 0; P.o2 = Math.min(P.o2Max, P.o2 + 5.6); } if ((P.gaspT = (P.gaspT === undefined ? 120 : P.gaspT) - dt) <= 0) { P.gaspT = M.rnd(90, 180); A.sfx('gasp'); B.noise(P.x, P.y, P.z, 34, 'gasp'); } }
    if (P.o2 <= 0) {
      if (P.carts > 0) { P.carts--; P.o2 = P.o2Max; A.sfx('swap'); Pm.say('hud', 'O2 CARTRIDGE CHANGED · ' + P.carts + ' LEFT'); }
      else if (P.breached) { P.o2 = 0; P.suffoT += dt; if (P.suffoT > 45) { P.suffoT = 0; Pm.loseFidelity(1, 'air'); } }
      else { P.o2 = 0; P.suffoT += dt; if (P.suffoT > 20) { Pm.die('air'); return; } }
    } else if (!P.breached) P.suffoT = 0;
    // scrubber and CO2
    P.lime = Math.max(0, P.lime - dt / (240 * (1 + P.up.scrub * 0.2)) * mult);
    const eff = P.lime > 0.25 ? 1 : P.lime / 0.25;
    if (eff < 1) P.paco2 += (1 - eff) * 0.45 * mult * dt / (1 + P.up.scrub * 0.25);
    else P.paco2 = Math.max(40, P.paco2 - dt * 0.7);
    if (!P.breached && P.paco2 > 90) { Pm.die('co2'); return; }
    P.paco2 = Math.min(P.paco2, 95);
    const tgt = 66 + P.thrust * 10 + (P.boost ? 25 : 0) + (panic ? 35 : 0) + Math.max(0, P.paco2 - 40) * 0.8 + (P.breathHold ? 12 : 0);
    P.hr = M.approach(P.hr, tgt, dt * 6);
    if (B.I.pressed('swap')) Pm.swapLime();
  }
  Pm.swapLime = function () { if (P.limes > 0) { P.limes--; P.lime = 1; A.sfx('swap'); B.Hud.toast('SCRUBBER CANISTER SWAPPED'); } else { A.sfx('deny'); Pm.say('hud', 'NO SPARE CANISTERS'); } };

  function pressure(dt) {
    const before = P.crush;
    if (P.braced) P.crush = Math.max(0, P.crush - 0.5 * dt);
    else if (P.z > P.rating) P.crush = Math.min(100, P.crush + Math.pow((P.z - P.rating) / 100, 1.5) * 0.6 * dt * (B.Z.crushMul || 1) * B.diff().crush);
    else P.crush = Math.max(0, P.crush - 2 * dt);
    for (const th of [25, 50, 75]) if (before < th && P.crush >= th) { A.sfx('knock3'); B.shake(4); B.Story.onKnock && B.Story.onKnock(th); }
    if (P.crush >= 100) { Pm.die('crush'); return; }
    R.post.curve = 0.04 - P.crush / 100 * 0.1;
    P.chroma = Math.max(0, P.chroma - dt); R.post.chroma = P.chroma > 0 ? 2 : 0;
  }

  function biomass(dt) {
    P.cap = 3 + P.up.tank;
    if (P.caul > 0) P.caul -= dt;
    const over = P.cells.length >= Math.ceil(P.cap * 2 / 3) && P.cells.length > 1;
    P.overT = over ? P.overT + dt : 0;
    if (P.overT > 90) {
      if ((P.singT -= dt) <= 0) { P.singT = 4; A.sfx('sing'); B.noise(P.x, P.y, P.z, 30, 'sing'); }
      if ((P.overFid = (P.overFid || 0) + dt) > 60) { P.overFid = 0; Pm.loseFidelity(1, 'overfill'); P.growth = Math.min(1, P.growth + 0.1); }
    }
  }

  function sonarTick(dt) {
    P.pingCD -= dt;
    if (P.ring > 0) {
      P.ring -= dt * (P.clamped ? 5 : 1);
      P.nodeT -= dt;
      if (P.nodeT <= 0) {
        P.nodeT = 0.25;
        const ln = P.lastNode;
        if (!ln || Math.hypot(ln.x - P.x, ln.y - P.y, ln.z - P.z) > 0.3) { const n = { x: P.x, y: P.y, z: P.z, t: B.time, muffled: E.inSilt(P.x, P.y, P.z) }; P.trail.push(n); P.lastNode = n; }
      }
    }
    P.trail = P.trail.filter(n => B.time - n.t < 12);
    P.pings = P.pings.filter(p => B.time - p.t0 < 1.2);
    if (B.frame % 30 === 0) for (const [k, v] of P.reveal) if (B.time > v[1]) P.reveal.delete(k);
  }

  function actions(dt) {
    // lamp: tap cycles white -> red -> off; hold throws a flare
    if (I.pressed('lamp')) P.lampHold = 0;
    if (P.lampHold >= 0) {
      P.lampHold += dt;
      if (P.lampHold > 0.55) { P.lampHold = -1; throwFlare(); }
      else if (I.released('lamp')) { P.lampHold = -1; P.lampMode = P.lampMode === 'white' ? 'red' : P.lampMode === 'red' ? 'off' : 'white'; A.sfx('click'); (B.signals = B.signals || []).push(B.time); }
    }
    // ping: tap = wide, hold-release = narrow cone toward the aim
    if (I.pressed('ping')) P.pingHold = 0;
    if (P.pingHold >= 0) { P.pingHold += dt; if (I.released('ping') || !I.down('ping')) { ping(P.pingHold > 0.25); P.pingHold = -1; } }
    // the Pick
    if (I.pressed('pick')) {
      if (P.anchor) { P.anchor = null; A.sfx('click'); }
      else if (P.powered && !P.braced) {
        const range = P.breached ? 18 : 12;
        let hit = B.World.rayRock(B.map, P.x, P.y, P.z - 0.3, P.aimX * 0.94, P.aimY * 0.94, 0.34, range);
        let ent = null;
        for (const e of E.list) {
          if (!e.alive || !e.anchor) continue;
          let ex = e.x, ey = e.y, ez = e.z;
          if (e.type === 'procession') { ex = e.px[0]; ey = e.py[0]; ez = M.clamp(P.z, e.zTop, e.zTop + e.len * e.cf); }
          const dx = ex - P.x, dy = ey - P.y, dz = ez - P.z, d = Math.hypot(dx, dy, dz);
          if (d > range + (e.r || 1)) continue;
          const along = (dx * P.aimX + dy * P.aimY) / Math.max(0.1, Math.hypot(dx, dy));
          if (along > 0.85 && (!hit || d < hit.t)) { hit = { x: ex, y: ey, z: ez, t: d }; ent = e; }
        }
        A.sfx('pickFire');
        if (hit) { P.anchor = { x: hit.x, y: hit.y, z: hit.z, len: Math.hypot(hit.x - P.x, hit.y - P.y, hit.z - P.z), ent }; A.sfx('pickHit', { delay: 0.12 }); }
        else { P.pickMiss = { t: B.time, x: P.x + P.aimX * range, y: P.y + P.aimY * range }; }
      }
    }
    // clamp (tap) / brace (hold)
    if (I.pressed('clamp')) P.clampHold = 0;
    if (P.clampHold >= 0) {
      P.clampHold += dt;
      const near = B.World.nearRock(B.map, P.x, P.y, P.z + 0.5, 1.7) || (P.anchor && Math.hypot(P.anchor.x - P.x, P.anchor.y - P.y, P.anchor.z - P.z) < 2.6);
      if (P.braced && I.released('clamp')) { P.braced = false; P.powered = true; P.rebootT = 2; P.clampHold = -1; A.sfx('boot'); B.Hud.toast('POWER RESTORED'); }
      else if (P.clampHold > 0.6 && !P.braced) {
        P.clampHold = -1;
        if (near) { P.braced = true; P.clamped = true; P.powered = false; A.sfx('clamp'); B.Hud.toast('BRACED · POWER DOWN'); B.Story.onBrace && B.Story.onBrace(); }
        else { A.sfx('deny'); Pm.say('hud', 'NOTHING TO BRACE AGAINST'); }
      } else if (I.released('clamp') && P.clampHold >= 0) {
        P.clampHold = -1;
        if (P.clamped) { P.clamped = false; A.sfx('click'); }
        else if (near) { P.clamped = true; P.vx = P.vy = P.vz = 0; A.sfx('clamp'); B.noise(P.x, P.y, P.z, 48, 'clamp'); }
        else { A.sfx('deny'); Pm.say('hud', 'NOTHING TO CLAMP TO'); }
      }
    }
    if (P.rebootT > 0) { P.rebootT -= dt; P.powered = P.rebootT <= 0; }
    // biomass cells
    for (let k = 0; k < 5; k++) if (I.pressed('c' + (k + 1))) useCell(k);
    if (I.pressed('cPrev')) P.sel = Math.max(0, P.sel - 1);
    if (I.pressed('cNext')) P.sel = Math.min(Math.max(0, P.cells.length - 1), P.sel + 1);
    if (I.pressed('useCell')) useCell(P.sel);
    if (I.pressed('graft')) graft();
    if (I.pressed('powerhead')) powerhead();
    if (I.pressed('craft')) { const c = E.list.find(e => e.alive && e.type === 'cairn' && Math.hypot(e.x - P.x, e.y - P.y, e.z - P.z) < 4); if (c) Pm.atCairn(c); else { A.sfx('deny'); Pm.say('hud', 'FABRICATOR NEEDS A CAIRN'); } }
    if (I.pressed('map')) { if (P.relics.hand) B.Hud.toggleMap(); else { A.sfx('deny'); Pm.say('hud', 'NO CHART'); } }
    if (I.down('gauge')) P.gaugeT = Math.max(P.gaugeT, 1.5); else P.gaugeT = Math.max(0, P.gaugeT - dt);
    if (I.down('wipe')) P.copepods = Math.max(0, P.copepods - dt * 0.6);
  }

  // Find the nearest thing to interact with; E (or A) uses it, holding when the action takes time.
  function interactScan(dt, lock) {
    let best = null, bd = 2.8;
    for (const e of E.list) {
      if (!e.alive || !e.interact) continue;
      let ex = e.x, ey = e.y, ez = e.z;
      if (e.type === 'procession') { ex = e.px[0]; ey = e.py[0]; ez = e.pz[0]; }
      const d = Math.hypot(ex - P.x, ey - P.y, (ez - P.z) * 0.8) - (e.reach || 0);
      if (d < bd) { const lb = e.interact.label(); if (lb) { bd = d; best = e; } }
    }
    P.prompt = best ? { label: best.interact.label(), hold: best.interact.hold || 0, prog: 0, e: best } : null;
    if (!best || lock) { P.interactT = 0; return; }
    if (best.interact.hold) {
      if (I.down('interact')) { P.interactT += dt; P.prompt.prog = P.interactT / best.interact.hold; if (P.interactT >= best.interact.hold) { P.interactT = 0; best.interact.fn.call(best); } }
      else P.interactT = 0;
    } else if (I.pressed('interact')) best.interact.fn.call(best);
  }

  function recordFrame() {
    const o = (recIdx % RECN) * 7;
    REC[o] = P.x; REC[o + 1] = P.y; REC[o + 2] = P.z; REC[o + 3] = P.yaw; REC[o + 4] = P.kick;
    REC[o + 5] = P.lampMode === 'white' ? 1 : P.lampMode === 'red' ? 2 : 0; REC[o + 6] = P.pingFlag || 0;
    recIdx++;
  }

  // ------------------------------------------------------------------ drawing
  Pm.draw = function () {
    if (!P) return;
    if (B.act === 'deck') {
      R.model(P.x, P.y, P.z, MD.person({ yaw: P.yaw, t: B.time, walk: P.walk, suit: '#d4621e', hair: '#3a2416', skin: '#c89070' }), {});
      return;
    }
    if (P.dead && B.Story.hideBody) return;
    // suit work lights: a dim spill so the rock right beside you reads
    if (P.powered && !P.braced) R.addLight(P.x, P.y, P.z - 0.6, 0.85, 0.9, 1, 6, 0.3);
    const f = H(P.x, P.y), alt = f - P.z;
    if (alt < 60 && !P.inCage) R.shadow(P.x, P.y, f, 0.9 + alt * 0.02, 0.85 * (1 - alt / 60));
    const west = Math.cos(MD.quant8(P.yaw)) < -0.3;
    const flip = P.flipped && west;
    const yaw = flip ? Math.PI - MD.quant8(P.yaw) : MD.quant8(P.yaw);
    const top = P.cells[P.cells.length - 1];
    // through the Lossless Shard her helmet is empty
    const L = B.lensOn, hollow = !!(L && Math.hypot(L.x - R.sx(P.x), L.y - R.sy(P.y, P.z) + 6) < L.r);
    const prims = MD.diver({
      yaw, pitch: P.thrust * 0.25 * (P.boost ? 1.4 : 1), t: B.time, kick: P.kick, lamp: R.env.lamp.on ? P.lampMode : 'off',
      fill: P.cells.length / P.cap, tankCol: top ? STRAIN[top].col : null, growth: P.growth, hollow,
    });
    R.model(P.x, P.y, P.z, prims, { scale: P.res, flip, lut: 1, minLight: 0.12 });
    // the Pick line
    if (P.anchor) {
      const hx = P.x + Math.cos(P.yaw) * 0.5, hy = P.y + Math.sin(P.yaw) * 0.6, hz = P.z + 0.1;
      if (P.breached) R.line(hx, hy, hz, P.anchor.x, P.anchor.y, P.anchor.z, 0.12, 0.5, 0.38, true, 0.9);
      else R.line(hx, hy, hz, P.anchor.x, P.anchor.y, P.anchor.z, 0.6, 0.6, 0.55, false);
    }
    if (P.caul > 0) R.disc(P.x, P.y, P.z - 0.4, 2.4, 0.5, 0.6, 0.3, 0.22 * Math.min(1, P.caul), false);
  };

  // ------------------------------------------------------------------ save / load
  Pm.serialize = function () {
    const keys = ['x', 'y', 'z', 'yaw', 'o2', 'o2Max', 'carts', 'lime', 'limes', 'air', 'rating', 'fidelity', 'res', 'flipped', 'breached', 'cells', 'growth', 'lampMode', 'trim'];
    const o = {}; for (const k of keys) o[k] = P[k];
    o.inv = Object.assign({}, P.inv); o.relics = Object.assign({}, P.relics); o.up = Object.assign({}, P.up);
    return JSON.parse(JSON.stringify(o));
  };
  Pm.restore = function (o) {
    P = B.player = Object.assign(Pm.fresh(), o, { inv: Object.assign(Pm.fresh().inv, o.inv), relics: Object.assign(Pm.fresh().relics, o.relics), up: Object.assign(Pm.fresh().up, o.up) });
    P.vx = P.vy = P.vz = 0; P.crush = 0; P.paco2 = 40;
    R.setFidelity(P.fidelity);
    return P;
  };
})(window.B);
</script>
<script>/* src/zones.js */
/* zones.js — the three Rules of the Trench (DESIGN.md §1.3):
 *  I   the Phantom Floor (420–560 m): false sonar, lamp backscatter, burglar alarms
 *  II  the Slow Wave and the SOFAR channel (900–1,300 m): invisible currents that carry you down
 *  III the Settling (3,000 m+): pre-echo and compression of palette, audio and HUD precision */
'use strict';
(function (B) {
  const M = B.M, A = B.A;
  const Z = B.Z = {
    wave: { phase: 'calm', t: 60, pull: 0, shear: 0, big: false }, ambientT: 0, ambientMax: 0, flicker: 0, crushMul: 1, preT: 20,
  };
  const DAY = 24 * 60; // compressed dive-clock day, seconds
  Z.layerTop = () => 440 + Math.sin((B.time / DAY) * Math.PI * 2) * 30;
  Z.inLayer = z => B.act === 'act1' && z > Z.layerTop() && z < Z.layerTop() + 60;
  Z.sofarAt = z => B.act === 'act2' && z > 900 && z < 1300;
  Z.flareAmbient = function (sec) { Z.ambientT = sec; Z.ambientMax = sec; };
  Z.bigWave = function () { const w = Z.wave; w.phase = 'warn'; w.t = 6; w.big = true; };
  Z.reset = function () { Z.wave = { phase: 'calm', t: 70, pull: 0, shear: 0, big: false }; Z.ambientT = 0; Z.flicker = 0; };

  // Depth readout precision collapses in the Settling.
  Z.depthText = function (z) {

    const extra = [];
    if (P && B.mode !== 'title' && !(sc && sc.hollow)) extra.push({ x: P.x, y: P.y, z: P.z, draw: () => B.Player.draw(), alive: true });
    if (sc && sc.hollow) extra.push({ x: P.x, y: P.y, z: P.z, alive: true, draw() { R.model(P.x, P.y, P.z, B.MD.diver({ yaw: Math.atan2(sc.cam.y - P.y, sc.cam.x - P.x), t: 0, kick: 0, lamp: 'off', hollow: true, growth: 1, fill: 1, tankCol: [0.1, 0.9, 0.6], plain: [] }), { scale: 1, minLight: 0.4 }); } });
    const saved = E.list; E.list = saved.concat(extra); E.draw(); E.list = saved;
    if (B.ghostFrame && B.mode === 'play') { const g = B.ghostFrame; R.model(g.x, g.y, g.z, B.MD.diver({ yaw: B.MD.quant8(g.yaw), t: B.time, kick: 0.5, lamp: 'off' }), { scale: P.res, lut: 1 }); B.ghostFrame = null; }
    // distant lights: pinpricks at their bearing when they're too deep to draw
    if (P && B.mode !== 'title') for (const L of S.distantLights()) {
      if (L.z > zCut + maxView - 2) {
        const fl = 0.8 + 0.2 * Math.sin(B.time * 3 + L.x), zz = zCut + maxView - 1;
        let sx = R.sx(L.x), sy = R.sy(L.y, zz);
        const inside = sx > 4 && sy > 4 && sx < R.W - 4 && sy < R.H - 4;
        if (inside) R.point(L.x, L.y, zz, 2, L.c[0] * fl, L.c[1] * fl, L.c[2] * fl, 3);
        else {
          // off-screen: pin it to the edge on its bearing, so there is always a light to steer by
          const cx = R.W / 2, cy = R.H / 2, dx = sx - cx, dy = sy - cy, k = Math.min((R.W / 2 - 6) / Math.abs(dx || 1e-6), (R.H / 2 - 6) / Math.abs(dy || 1e-6));
          sx = Math.round(cx + dx * k); sy = Math.round(cy + dy * k);
          const b = R.buffers(), i = sy * R.W + sx;
          for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) { const j = i + oy * R.W + ox; if (j >= 0 && j < b.FR.length) { const k = (ox || oy ? 0.5 : 1) * fl; b.FR[j] += L.c[0] * k; b.FG[j] += L.c[1] * k; b.FB[j] += L.c[2] * k; b.EM[j] = 1; } }
        }
      }
    }
    const ox = R.cam.ox, oy = R.cam.oy;
    if (!topside) snow.draw(dt, ox - lastOx, oy - lastOy);
    else if (B.act === 'deck') rain(dt);
    lastOx = ox; lastOy = oy;
    // the lamp beam made visible by particulate; strong in the scattering layer and in silt
    if (P && env.lamp.on && B.mode !== 'title' && !(sc && sc.cam)) {
      const L = env.lamp, turb = (B.Z.inLayer(P.z) ? 0.26 : 0.11) + (E.inSilt(P.x, P.y, P.z) ? 0.25 : 0) + (eyeZ > 200 && eyeZ < 1000 ? 0.03 : 0);
      // the beam stops where it meets rock
      const range = Math.sqrt(L.r2), hit = B.World.rayRock(B.map, L.x, L.y, L.z, L.dx, L.dy, L.dz, range), frac = hit ? Math.max(0.15, hit.t / range) : 1;
      // scattered light reads blue-white in water
      if (L.mode === 'red') R.beam(R.sx(L.x), R.sy(L.y, L.z), L.dx * B.PX, L.dy * B.PY, range * B.PX * 0.85 * frac, 0.45, turb, 0.5, 0.04, 0.02);
      else R.beam(R.sx(L.x), R.sy(L.y, L.z), L.dx * B.PX, L.dy * B.PY, range * B.PX * 0.85 * frac, 0.32, turb, 0.3, 0.42, 0.5);
    }
    // god rays near the surface
    if (eyeZ < 110 && !topside && B.mode !== 'title') {
      godRays((1 - eyeZ / 110) * 0.03, B.time);
    }
    // palette
    let lut = sc && sc.lut ? sc.lut : B.mode === 'title' ? 'ben2' : B.zoneFor(B.act, eyeZ);
    if (P && B.mode === 'play' && !topside) { if (P.listening) lut = 'listen'; else if (env.lamp.on && P.lampMode === 'red') lut = 'red'; }
    R.spread = B.zoneDither[lut] || 0.1;
    R.mono = lut === 'eye';
    // the Lossless Shard: hold B to look through a piece of your own viewport
    R.lens = null;
    if (P && B.mode === 'play' && !topside && P.relics.shards > 0 && I.down('lens')) {
      let lx = R.sx(P.x) + P.aimX * 70, ly = R.sy(P.y, P.z) + P.aimY * 46;
      if (I.mouse.inside && !I.usingPad) { lx = I.mouse.x; ly = I.mouse.y; }
      R.lens = { x: lx, y: ly, r: 32 };
    }
    B.lensOn = R.lens;
    R.quantize(B.lut(lut), P ? P.fidelity : 16);
    if (R.lens) R.ellipse(R.lens.x, R.lens.y, 33, 33, 0xffeee6c4);
    R.flushWires(); R.flushOverlays();
    if (B.mode === 'play' && P && !topside) Hd.drawSonar();
    if (sc && sc.dimWorld) R.shadeRect(0, 0, R.W, R.H, 0xff000000, 0.5);
  }
  B.renderWorld = renderWorld;
  // Rain coming in sideways across the deck.
  const drops = []; for (let k = 0; k < 140; k++) drops.push({ x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 0.6 });
  function rain(dt) {
    const b = R.buffers(), W = R.W, Hh = R.H;
    for (const d of drops) {
      d.x += dt * 0.5 * d.s; d.y += dt * 0.9 * d.s; if (d.x > 1) d.x -= 1; if (d.y > 1) d.y -= 1;
      const x0 = d.x * W, y0 = d.y * Hh;
      for (let t = 0; t < 5; t++) { const x = (x0 + t * 0.55) | 0, y = (y0 + t) | 0; if (x < 0 || y < 0 || x >= W || y >= Hh) continue; const i = y * W + x; b.FR[i] += 0.05; b.FG[i] += 0.055; b.FB[i] += 0.065; }
    }
  }
  // Slanted light shafts near the surface: bands along one diagonal, wobbling slowly. Tabled sine, no per-pixel trig.
  const SIN = new Float32Array(1024); for (let k = 0; k < 1024; k++) SIN[k] = Math.sin(k / 1024 * Math.PI * 2);
  const sn = v => SIN[((v * 162.97) | 0) & 1023];
  function godRays(kk, t) {
    const b = R.buffers(), W = R.W, Hh = R.H;
    const wob = new Float32Array(W); for (let x = 0; x < W; x++) wob[x] = sn(x * 0.011 + t * 0.15) * 2 + x * 0.07 + t * 0.25;
    for (let y = 0; y < Hh; y += 1) {
      const yo = -y * 0.035, mod = kk * (0.6 + 0.4 * sn(y * 0.02 - t * 0.3)) * 5;
      for (let x = (y & 1); x < W; x += 2) {
        const band = sn(wob[x] + yo); if (band <= 0.8) continue;
        const a = (band - 0.8) * mod, i = y * W + x; b.FR[i] += a * 0.4; b.FG[i] += a * 0.85; b.FB[i] += a;
        if (x + 1 < W) { b.FR[i + 1] += a * 0.4; b.FG[i + 1] += a * 0.85; b.FB[i + 1] += a; }
      }
    }
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    acc += dt;
    I.poll();
    let steps = 0;
    while (acc >= 1 / 60 && steps < 4) { tick(1 / 60); acc -= 1 / 60; steps++; I.endTick(); }
    if (steps === 4) acc = 0;
    draw(dt); autoQuality(dt);
    B.fps = B.fps ? B.fps * 0.95 + (1 / Math.max(dt, 0.001)) * 0.05 : 60;
    requestAnimationFrame(frame);
  }
  function draw(dt) {
    const t0 = performance.now();
    R.post.flash = Math.max(0, R.post.flash - dt * 1.6);
    if (!B.player || B.mode === 'title') R.post.curve = 0.04;
    if (B.mode === 'boot') { Hd.drawBootScreen(); }
    else if (B.mode === 'title') { renderWorld(dt); Hd.drawTitle(); }
    else if (B.mode === 'pause') { Hd.drawPause(pauseSnap, pauseT); }
    else if (B.mode === 'scene') { const sc = B.scene; if (!sc || sc.world) renderWorld(dt); if (sc && sc.world !== false) Hd.draw(); if (sc && sc.draw) sc.draw(); }
    else { renderWorld(dt); Hd.draw(); if (B.mode === 'dead') Hd.drawDead(B.deadT, B.deadCause); }
    Hd.drawFade();
    if (B.debugHUD) Hd.text(2, R.H - 9, Math.round(B.fps) + ' FPS ' + B.renderMs.toFixed(1) + ' MS', 0xff00ff00);
    B.renderMs = B.renderMs * 0.9 + (performance.now() - t0) * 0.1;
    R.present();
  }

  // ------------------------------------------------------------------ boot
  function init() {
    const cv = document.getElementById('game');
    R.initOutput(cv);
    B.W = 0; R.W = 0; B.setRes(480, 270);
    B.bindMouse(cv);
    addEventListener('resize', () => R.resize());
    B.onGesture = function () {
      if (!A.ready) A.init(); A.resume();
      if (B.mode === 'boot') B.toTitle();
    };
    B.onBlur = function () { if (B.mode === 'play' && !B.noAutoPause) pause(); };
    const q = new URLSearchParams(location.search);
    B.debugHUD = q.has('fps') || q.has('debug');
    // warm the commonest palettes in idle slices so the first descent doesn't hitch
    const warm = ['top', 'sun', 'twi', 'deep', 'ben2', 'red', 'listen', 'd94', 'd71', 'dmara'];
    const step = () => { const n = warm.shift(); if (n) { B.lut(n); setTimeout(step, 30); } };
    setTimeout(step, 100);
    requestAnimationFrame(frame);
  }
  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', init); else init();

  // ------------------------------------------------------------------ debug and test hooks
  B.debug = {
    start(act, z, opts) {
      if (!A.ready) A.init();
      Hd.closeMenu(); B.scene = null; R.env.lamp.on = false; B.player = null;
      S.newState(false); B.mode = 'play';
      const flags = Object.assign({}, opts && opts.flags);
      Object.assign(B.state.flags, flags);
      if (act === 'deck') { S.loadAct('deck'); return; }
      S.loadAct(act, z !== undefined ? Object.assign({}, { act1: { x: 92, y: 80 }, act2: { x: 210, y: 210 }, act3: { x: 62, y: 64 } }[act], { z }) : null);
      if (opts && opts.breached) { const p = B.player; p.breached = true; p.res = act === 'act3' ? 3 : 2; p.flipped = true; p.rating = Math.max(p.rating, act === 'act3' ? 3700 : 1600); B.state.flags.breached = true; B.state.flags.breachStarted = true; }
    },
    warp(x, y, z) { const p = B.player; p.x = x; p.y = y; p.z = z; p.vx = p.vy = p.vz = 0; B.snapCamera = true; },
    give() { const p = B.player; Object.assign(p.inv, { ti: 9, cer: 9, cu: 9, foam: 9, cell: 9, glass: 9, chitin: 9, flare: 9, shell: 3 }); p.carts = 9; p.limes = 9; },
    god(on) { S.godMode = on !== false; },
    tick: (n) => { for (let k = 0; k < (n || 1); k++) { tick(1 / 60); I.endTick(); } },
    draw: () => draw(1 / 60),
  };
})(window.B);
</script>
</body>
